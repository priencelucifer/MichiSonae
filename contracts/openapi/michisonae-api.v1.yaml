openapi: 3.1.0
info:
  title: MichiSonae API
  version: 1.0.0
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/observations:batch:
    post:
      operationId: ingestObservationBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatch"
      responses:
        "202":
          description: >-
            Every new observation and its outbox event committed atomically.
            Previously stored identical event_id values are reported as
            duplicates and do not create another business effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationBatchAccepted"
        "409":
          description: >-
            An event_id already exists with different content. The entire
            batch is rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: A valid installation access credential is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: An observation claimed a different installation identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "415":
          description: Request content type is not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Installation or client-IP rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            The batch was not accepted because the durable store or required
            schema is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request validation failed.
  /v1/installations:register:
    post:
      operationId: registerAnonymousInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationRegistration"
      responses:
        "201":
          description: Opaque anonymous installation credentials were issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousCredentials"
        "413":
          description: Request body exceeds the configured size limit.
        "415":
          description: Request content type is not application/json.
        "429":
          description: Registration rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Security storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request validation failed.
  /v1/auth:refresh:
    post:
      operationId: refreshAnonymousCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshCredentialRequest"
      responses:
        "200":
          description: A rotated access and refresh credential pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnonymousCredentials"
        "401":
          description: Refresh credential is invalid, expired, or reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeds the configured size limit.
        "415":
          description: Request content type is not application/json.
        "429":
          description: Refresh rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Security storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Request validation failed.
  /v1/installations/current:
    delete:
      operationId: revokeAnonymousInstallation
      responses:
        "204":
          description: Installation credentials and token families were revoked.
        "401":
          description: A valid installation access credential is required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Security storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/regions/{region_id}/hazards:
    get:
      operationId: getRegionalHazards
      parameters:
        - name: region_id
          in: path
          required: true
          schema:
            type: string
          description: Global geohash region in the configured `gh5:<cell>` form.
        - name: version
          in: query
          required: false
          schema:
            anyOf:
              - type: string
                pattern: "^[0-9a-f]{64}$"
              - type: "null"
          description: Immutable content-addressed snapshot version.
      responses:
        "200":
          description: Current or explicitly versioned regional hazard snapshot.
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalHazardSnapshot"
        "304":
          description: The requested representation matches If-None-Match.
        "400":
          description: region_id is not in the configured global region format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The requested immutable version does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Client-IP origin rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Snapshot storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Query validation failed.
components:
  schemas:
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
        version:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ObservationBatch:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - observations
      properties:
        schema_version:
          type: string
          const: "1.0"
        observations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "../events/road-observation.v1.schema.json"
    ObservationBatchAccepted:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - received_count
        - stored_count
        - duplicate_count
      properties:
        schema_version:
          type: string
          const: "1.0"
        received_count:
          type: integer
          minimum: 1
          maximum: 100
        stored_count:
          type: integer
          minimum: 0
          maximum: 100
        duplicate_count:
          type: integer
          minimum: 0
          maximum: 100
    InstallationRegistration:
      type: object
      additionalProperties: false
      required:
        - schema_version
      properties:
        schema_version:
          const: "1.0"
        attestation:
          anyOf:
            - type: string
              minLength: 16
              maxLength: 2048
            - type: "null"
    RefreshCredentialRequest:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - refresh_token
      properties:
        schema_version:
          const: "1.0"
        refresh_token:
          type: string
          minLength: 40
          maxLength: 256
    AnonymousCredentials:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
      properties:
        schema_version:
          const: "1.0"
        installation_id:
          type: string
          minLength: 16
          maxLength: 128
        token_type:
          const: Bearer
        access_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time
    HazardCoverage:
      type: object
      additionalProperties: false
      required:
        - status
        - basis
      properties:
        status:
          const: unknown
        basis:
          enum:
            - community_observations_only
            - no_published_snapshot
    PublicHazard:
      type: object
      additionalProperties: false
      required:
        - hazard_id
        - kind
        - latitude
        - longitude
        - severity
        - confidence
        - contributor_count
        - lifecycle_state
        - match_state
        - road_segment_id
        - first_detected_at
        - last_detected_at
        - policy_version
      properties:
        hazard_id:
          type: string
          pattern: "^[0-9a-f]{24}$"
        kind:
          enum:
            - road_damage
            - rough_road
            - obstruction
            - flooding
            - manhole_hazard
            - road_construction
            - disabled_vehicle
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        severity:
          type: number
          minimum: 0
          maximum: 1
        confidence:
          type: number
          minimum: 0
          maximum: 1
        contributor_count:
          type: integer
          minimum: 2
        lifecycle_state:
          enum: [provisional, confirmed]
        match_state:
          enum: [unmatched, map_matched, operator_verified]
        road_segment_id:
          anyOf:
            - type: string
            - type: "null"
        first_detected_at:
          type: string
          format: date-time
        last_detected_at:
          type: string
          format: date-time
        policy_version:
          type: string
    RegionalHazardSnapshot:
      type: object
      additionalProperties: false
      required:
        - region_id
        - version
        - generated_at
        - source_updated_at
        - hazard_count
        - coverage
        - hazards
      properties:
        schema_version:
          const: "1.0"
        region_id:
          type: string
        version:
          anyOf:
            - type: string
              pattern: "^[0-9a-f]{64}$"
            - type: "null"
        generated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        source_updated_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        hazard_count:
          type: integer
          minimum: 0
        coverage:
          $ref: "#/components/schemas/HazardCoverage"
        hazards:
          type: array
          items:
            $ref: "#/components/schemas/PublicHazard"

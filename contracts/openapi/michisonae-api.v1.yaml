openapi: 3.1.0
info:
  title: MichiSonae API
  version: 0.2.0
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /v1/observations:batch:
    post:
      operationId: ingestObservationBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObservationBatch"
      responses:
        "202":
          description: >-
            Every new observation and its outbox event committed atomically.
            Previously stored identical event_id values are reported as
            duplicates and do not create another business effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationBatchAccepted"
        "409":
          description: >-
            An event_id already exists with different content. The entire
            batch is rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            The batch was not accepted because the durable store or required
            schema is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    Health:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
        version:
          type: string
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ObservationBatch:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - observations
      properties:
        schema_version:
          const: "1.0"
        observations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "../events/road-observation.v1.schema.json"
    ObservationBatchAccepted:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - received_count
        - stored_count
        - duplicate_count
      properties:
        schema_version:
          const: "1.0"
        received_count:
          type: integer
          minimum: 1
          maximum: 100
        stored_count:
          type: integer
          minimum: 0
          maximum: 100
        duplicate_count:
          type: integer
          minimum: 0
          maximum: 100

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "michisonae-api"
version = "1.0.0"
description = "MichiSonae road-observation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.140.7",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.9.1",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "pyyaml==6.0.3",
  "ruff==0.16.0",
]

[project.scripts]
michi-migrate = "michisonae_api.migrate:main"
michi-project = "michisonae_api.worker:main"
michi-snapshot = "michisonae_api.snapshot_worker:main"
michi-maintain = "michisonae_api.maintenance:main"
michi-probe = "michisonae_api.probe:main"

[tool.hatch.build.targets.wheel]
packages = ["src/michisonae_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["michisonae_api"]
mypy_path = "src"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "michisonae-api"
version = "0.1.0"
description = "MichiSonae road-observation API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx2==2.7.0",
  "mypy>=1.19,<2",
  "pytest>=9,<10",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/michisonae_api"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["michisonae_api"]
mypy_path = "src"

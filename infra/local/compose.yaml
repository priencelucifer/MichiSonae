name: michisonae-local

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: michisonae
      POSTGRES_USER: michisonae
      POSTGRES_PASSWORD: michisonae
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U michisonae -d michisonae
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

name: michisonae-${MICHI_ENVIRONMENT:?set MICHI_ENVIRONMENT}

x-provider-bindings:
  public_base_url: ${MICHI_PUBLIC_BASE_URL:?set public HTTPS URL}
  object_storage_bucket: ${MICHI_OBJECT_STORAGE_BUCKET:?set snapshot object storage}
  cdn_distribution_id: ${MICHI_CDN_DISTRIBUTION_ID:?set CDN binding}
  tls_certificate: ${MICHI_TLS_CERTIFICATE_ID_OR_PATH:?set TLS binding}
  waf_policy_id: ${MICHI_WAF_POLICY_ID:?set WAF binding}

x-operational-guardrails:
  database_connection_budget: ${MICHI_DATABASE_CONNECTION_BUDGET:?set connection budget}
  backup_retention_days: ${MICHI_BACKUP_RETENTION_DAYS:?set backup retention}
  pitr_window_days: ${MICHI_PITR_WINDOW_DAYS:?set PITR window}
  monthly_budget_usd: ${MICHI_MONTHLY_BUDGET_USD:?set monthly budget}
  budget_alert_percentages: ${MICHI_BUDGET_ALERT_PERCENTAGES:?set budget alerts}

x-runtime: &runtime
  image: ${MICHI_IMAGE:?set immutable MICHI_IMAGE}
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 45s

x-common-environment: &common-environment
  MICHI_ENVIRONMENT: ${MICHI_ENVIRONMENT}
  MICHI_RATE_LIMIT_HASH_SECRET_FILE: /run/secrets/rate_limit_hash_secret
  MICHI_TRUSTED_PROXY_CIDRS: ${MICHI_TRUSTED_PROXY_CIDRS}
  MICHI_JSON_LOGGING_ENABLED: "true"
  MICHI_LOG_LEVEL: ${MICHI_LOG_LEVEL:-INFO}

services:
  migrate:
    <<: *runtime
    profiles: ["release"]
    restart: "no"
    command: ["michi-migrate"]
    environment:
      <<: *common-environment
      MICHI_DATABASE_URL_FILE: /run/secrets/migration_database_url
      MICHI_DATABASE_POOL_MIN_SIZE: "0"
      MICHI_DATABASE_POOL_MAX_SIZE: "1"
    secrets:
      - migration_database_url
      - rate_limit_hash_secret

  api:
    <<: *runtime
    command:
      - uvicorn
      - michisonae_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --timeout-graceful-shutdown
      - "30"
      - --limit-concurrency
      - ${MICHI_API_LIMIT_CONCURRENCY:-200}
    environment:
      <<: *common-environment
      MICHI_DATABASE_URL_FILE: /run/secrets/api_database_url
      MICHI_DATABASE_POOL_MIN_SIZE: ${MICHI_API_DATABASE_POOL_MIN_SIZE:-1}
      MICHI_DATABASE_POOL_MAX_SIZE: ${MICHI_API_DATABASE_POOL_MAX_SIZE:-5}
    secrets:
      - api_database_url
      - rate_limit_hash_secret
    ports:
      - "127.0.0.1:${MICHI_API_HOST_PORT:-8000}:8000"
    deploy:
      replicas: ${MICHI_API_REPLICAS:-1}
      resources:
        limits:
          cpus: ${MICHI_API_CPU_LIMIT:-0.50}
          memory: ${MICHI_API_MEMORY_LIMIT:-384M}

  projection:
    <<: *runtime
    command: ["michi-project"]
    environment:
      <<: *common-environment
      MICHI_DATABASE_URL_FILE: /run/secrets/projection_database_url
      MICHI_DATABASE_POOL_MIN_SIZE: ${MICHI_PROJECTION_DATABASE_POOL_MIN_SIZE:-1}
      MICHI_DATABASE_POOL_MAX_SIZE: ${MICHI_PROJECTION_DATABASE_POOL_MAX_SIZE:-5}
    secrets:
      - projection_database_url
      - rate_limit_hash_secret
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:9101/health/ready', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      replicas: ${MICHI_PROJECTION_REPLICAS:-1}
      resources:
        limits:
          cpus: ${MICHI_PROJECTION_CPU_LIMIT:-0.50}
          memory: ${MICHI_PROJECTION_MEMORY_LIMIT:-256M}

  snapshot:
    <<: *runtime
    command: ["michi-snapshot"]
    environment:
      <<: *common-environment
      MICHI_DATABASE_URL_FILE: /run/secrets/snapshot_database_url
      MICHI_DATABASE_POOL_MIN_SIZE: ${MICHI_SNAPSHOT_DATABASE_POOL_MIN_SIZE:-1}
      MICHI_DATABASE_POOL_MAX_SIZE: ${MICHI_SNAPSHOT_DATABASE_POOL_MAX_SIZE:-5}
    secrets:
      - snapshot_database_url
      - rate_limit_hash_secret
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from urllib.request import urlopen;
          urlopen('http://127.0.0.1:9102/health/ready', timeout=2).read()
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    deploy:
      replicas: ${MICHI_SNAPSHOT_REPLICAS:-1}
      resources:
        limits:
          cpus: ${MICHI_SNAPSHOT_CPU_LIMIT:-0.25}
          memory: ${MICHI_SNAPSHOT_MEMORY_LIMIT:-256M}

secrets:
  migration_database_url:
    file: ${MICHI_MIGRATION_DATABASE_URL_SECRET_FILE:?set migration database secret file}
  api_database_url:
    file: ${MICHI_API_DATABASE_URL_SECRET_FILE:?set API database secret file}
  projection_database_url:
    file: ${MICHI_PROJECTION_DATABASE_URL_SECRET_FILE:?set projection database secret file}
  snapshot_database_url:
    file: ${MICHI_SNAPSHOT_DATABASE_URL_SECRET_FILE:?set snapshot database secret file}
  rate_limit_hash_secret:
    file: ${MICHI_RATE_LIMIT_HASH_SECRET_FILE:?set rate-limit secret file}

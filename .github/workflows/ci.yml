name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify monorepo boundaries
        run: |
          test -d apps/android
          test -d services/api
          test -d firmware/roadsense
          test -d hardware
          test -d contracts
          test -d infra
          test -d simulator
          test -f docs/MASTER_PLAN.md
      - name: Parse JSON contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("contracts").rglob("*.json"))
          if not files:
              raise SystemExit("no JSON contracts found")
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"valid JSON: {path}")
          PY
      - name: Exercise deterministic simulator
        run: |
          python simulator/generate_road_observations.py --count 5 --seed 7 > observations.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path("observations.jsonl").read_text(encoding="utf-8").splitlines()
          ]
          assert len(rows) == 5
          assert all(row["detector_version"] == "synthetic-v1" for row in rows)
          PY

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - run: gradle testDebugUnitTest lintDebug assembleDebug --stacktrace

  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/roadsense
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio==6.1.19
      - run: pio run

name: Bug report
description: Report reproducible incorrect behavior without sensitive data.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, VINs, precise trip histories, raw OBD traces or emergency contact data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Non-sensitive environment details
    validations:
      required: true
